<!doctype html>
<html lang="vi" data-view-transition>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Otaku Archive</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='18' fill='%23ff3d83'/%3E%3Cpath d='M32 47s-14-8.6-14-19a8 8 0 0 1 14-5 8 8 0 0 1 14 5c0 10.4-14 19-14 19z' fill='%2333101f'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,500..800&family=Be+Vietnam+Pro:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:light dark;
  --paper:light-dark(#ffeaf2,#1a0812);
  --paper-2:light-dark(#ffd9e8,#26101d);
  --card:light-dark(#fff8fb,#2d1524);
  --ink:light-dark(#33101f,#ffe9f2);
  --ink-2:light-dark(#8a4a67,#d99bb7);
  --line:light-dark(#f2bcd2,#4b2539);
  --pink:#ff3d83;
  --pink-ink:light-dark(#c81d6b,#ff8db8);
  --bubble:#ffb6d1;
  --on-pink:#33101f;
  --ease:cubic-bezier(.2,.8,.2,1);
  --display:"Bricolage Grotesque","Arial Narrow",system-ui,sans-serif;
  --body:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",sans-serif;
}
:root[data-theme=light]{color-scheme:light}
:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{
  margin:0;min-height:100vh;color:var(--ink);font:400 15px/1.6 var(--body);
  background:
    radial-gradient(1100px 620px at 92% -8%,color-mix(in srgb,var(--pink) 20%,transparent),transparent 65%),
    var(--paper);
  background-attachment:fixed;
}
body.lb-open{overflow:hidden}
button{font:inherit;color:inherit}
a{color:inherit;text-decoration:none}
img{display:block}
:focus-visible{outline:2.5px solid var(--pink);outline-offset:3px;border-radius:6px}
::selection{background:var(--pink);color:var(--on-pink)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* ---------- header ---------- */
.top{position:sticky;top:0;z-index:30;height:68px;padding:0 max(5vw,env(safe-area-inset-left));
  display:flex;align-items:center;justify-content:space-between;gap:16px;
  background:color-mix(in srgb,var(--paper) 78%,transparent);backdrop-filter:blur(16px) saturate(1.4);
  border-bottom:1px solid color-mix(in srgb,var(--line) 70%,transparent)}
.brand{display:flex;align-items:center;gap:10px;font:700 20px/1 var(--display);letter-spacing:-.02em;font-stretch:85%}
.brand i{width:34px;height:34px;border-radius:11px;background:var(--pink);color:var(--on-pink);display:grid;place-items:center}
.brand i svg{width:18px;height:18px;fill:currentColor;stroke:none}
.top-r{display:flex;gap:8px;align-items:center}
.pill{height:42px;border-radius:99px;border:1.5px solid var(--line);background:color-mix(in srgb,var(--card) 80%,transparent);
  padding:0 16px;display:inline-flex;align-items:center;gap:10px;cursor:pointer;color:var(--ink-2);transition:border-color .2s,color .2s,background .2s}
.pill:hover{border-color:var(--pink);color:var(--ink)}
.pill.sq{width:42px;padding:0;justify-content:center}
kbd{font:500 11px var(--body);border:1px solid var(--line);border-radius:6px;padding:1px 6px;color:var(--ink-2);background:var(--card)}
.menu{position:absolute;right:max(5vw,12px);top:62px;min-width:230px;background:var(--card);border:1px solid var(--line);
  border-radius:16px;padding:6px;box-shadow:0 24px 50px -20px rgba(120,10,60,.5);
  opacity:0;transform:translateY(-6px) scale(.98);pointer-events:none;transition:.22s var(--ease);transform-origin:top right}
.menu.open{opacity:1;transform:none;pointer-events:auto}
.menu button{display:flex;width:100%;gap:12px;align-items:center;text-align:left;border:0;background:none;padding:11px 12px;border-radius:10px;cursor:pointer}
.menu button:hover{background:var(--paper-2)}
.menu small{display:block;color:var(--ink-2);font-size:12px;line-height:1.3}

/* ---------- buttons ---------- */
.btn{height:46px;border-radius:99px;padding:0 22px;border:1.5px solid color-mix(in srgb,var(--ink) 22%,transparent);
  background:transparent;display:inline-flex;gap:9px;align-items:center;justify-content:center;cursor:pointer;font-weight:500;
  transition:transform .25s var(--ease),background .2s,border-color .2s,box-shadow .25s}
.btn:hover{border-color:var(--ink);transform:translateY(-1px)}
.btn.primary{background:var(--pink);color:var(--on-pink);border-color:var(--pink);font-weight:600}
.btn.primary:hover{box-shadow:0 12px 26px -10px var(--pink);transform:translateY(-2px)}
.btn.danger{color:var(--pink-ink);border-color:color-mix(in srgb,var(--pink) 45%,transparent)}
.btn.danger:hover{background:color-mix(in srgb,var(--pink) 12%,transparent);border-color:var(--pink)}
.btn.sm{height:38px;padding:0 16px;font-size:13px}
.btn[aria-pressed=true]{background:var(--ink);color:var(--paper);border-color:var(--ink)}

/* ---------- layout ---------- */
main{padding:0 5vw 40px;max-width:1500px;margin:0 auto}
.crumbs{display:flex;flex-wrap:wrap;gap:8px;align-items:center;color:var(--ink-2);font-size:13px}
.crumbs a:hover{color:var(--pink-ink);text-decoration:underline;text-underline-offset:4px}
.crumbs b{font-weight:500;color:var(--ink)}
.page-head{padding:38px 0 34px}
.page-head h1{font:700 clamp(44px,6.6vw,96px)/.94 var(--display);font-stretch:80%;letter-spacing:-.035em;margin:18px 0 14px;text-wrap:balance;overflow-wrap:anywhere}
.page-head p{margin:0;color:var(--ink-2);font-size:16px}
.head-actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:26px}

/* ---------- hero ---------- */
.hero{display:grid;grid-template-columns:1.05fr .95fr;gap:4vw;align-items:center;padding:3vh 0 5vh;position:relative}
.hero h1{font:700 clamp(54px,8.6vw,128px)/.9 var(--display);font-stretch:78%;letter-spacing:-.04em;margin:0 0 22px;text-wrap:balance}
.hero p{max-width:30em;margin:0 0 28px;color:var(--ink-2);font-size:17px}
.hero-actions{display:flex;gap:10px;flex-wrap:wrap}
.fan{position:relative;width:min(100%,460px);aspect-ratio:1/1.08;justify-self:center}
.pol{position:absolute;aspect-ratio:3/4;background:#fff;padding:2.4% 2.4% 10%;border-radius:7px;
  box-shadow:0 22px 44px -20px rgba(140,10,70,.6),0 2px 0 rgba(255,255,255,.4) inset;
  transform:translate(calc(var(--mx,0)*var(--d)*1px),calc(var(--my,0)*var(--d)*1px)) rotate(var(--r));
  transition:transform .3s ease-out}
.pol img,.pol .ph{width:100%;height:100%;object-fit:cover;border-radius:3px}
.ph{background:linear-gradient(150deg,var(--bubble),var(--pink));display:grid;place-items:center;
  font:700 64px var(--display);color:var(--on-pink)}
.intro .pol{animation:drop 1s var(--ease) backwards;animation-delay:calc(var(--i)*110ms + 120ms)}
.intro .hero h1,.intro .hero p,.intro .hero-actions{animation:rise .9s var(--ease) backwards}
.intro .hero p{animation-delay:.08s}.intro .hero-actions{animation-delay:.16s}
.intro .row{animation:rise .8s var(--ease) backwards;animation-delay:calc(min(var(--i),12)*45ms + 500ms)}
@keyframes drop{from{opacity:0;transform:translateY(-90%) rotate(calc(var(--r) - 24deg))}}
@keyframes rise{from{opacity:0;transform:translateY(28px)}}

/* ---------- index ---------- */
.index-bar{display:flex;justify-content:space-between;align-items:flex-end;gap:18px;flex-wrap:wrap;
  border-bottom:2px solid var(--ink);padding-bottom:16px;margin-bottom:6px}
.index-bar h2{margin:0;font:700 34px/1 var(--display);font-stretch:85%;letter-spacing:-.02em}
.index-bar h2 span{color:var(--pink-ink);margin-left:8px}
.ctrl{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.filter{height:42px;min-width:240px;border-radius:99px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);padding:0 18px;outline:none;font:inherit;font-size:14px}
.filter:focus{border-color:var(--pink)}
.seg{display:flex;border:1.5px solid var(--line);border-radius:99px;padding:3px;background:var(--card)}
.seg button{border:0;background:none;height:34px;padding:0 14px;border-radius:99px;cursor:pointer;color:var(--ink-2);font-size:13px;font-weight:500}
.seg button[aria-pressed=true]{background:var(--pink);color:var(--on-pink)}
.grp{display:grid;grid-template-columns:clamp(54px,8vw,110px) 1fr}
.letter{position:sticky;top:84px;align-self:start;padding-top:26px;font:700 clamp(22px,2.4vw,34px)/1 var(--display);color:var(--pink-ink)}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:20px;padding:16px 0 14px;border-bottom:1px solid var(--line);
  transition:opacity .3s,color .3s,padding .45s var(--ease)}
.row .t{font:700 clamp(34px,6.4vw,96px)/.98 var(--display);font-stretch:78%;letter-spacing:-.035em;overflow-wrap:anywhere}
.row .m{color:var(--ink-2);font-size:13px;white-space:nowrap;text-align:right}
.list:has(.row:hover) .row:not(:hover),.list:has(.row:focus-visible) .row:not(:focus-visible){opacity:.28}
.row:hover,.row:focus-visible{color:var(--pink-ink);padding-left:18px}
.gridv{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:22px;padding-top:26px}
.gcard{position:relative;display:block;aspect-ratio:3/4;border-radius:20px;overflow:hidden;background:var(--paper-2);isolation:isolate}
.gcard img,.gcard .ph{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 22%;border-radius:0;transition:transform .8s var(--ease)}
.gcard:hover img{transform:scale(1.06)}
.gcard::after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 45%,rgba(60,5,30,.82));z-index:1}
.gcard div{position:absolute;left:18px;right:18px;bottom:16px;z-index:2;color:#fff}
.gcard b{display:block;font:700 28px/1 var(--display);font-stretch:80%;letter-spacing:-.02em;overflow-wrap:anywhere}
.gcard small{opacity:.85;font-size:12px}

/* peek (xem trước khi rê chuột vào danh sách) */
.peek{position:fixed;left:0;top:0;z-index:25;pointer-events:none;will-change:transform}
.peek-in{width:230px;aspect-ratio:3/4;background:#fff;padding:9px 9px 34px;border-radius:8px;
  box-shadow:0 30px 60px -22px rgba(140,10,70,.7);opacity:0;scale:.82;transition:opacity .25s,scale .35s var(--ease)}
.peek.on .peek-in{opacity:1;scale:1}
.peek-in img,.peek-in .ph{width:100%;height:100%;object-fit:cover;object-position:center 22%;border-radius:4px}

/* ---------- character stacks ---------- */
.stacks{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:48px 34px;padding:10px 0 40px}
.stack{display:block}
.stack:nth-child(even){margin-top:42px}
.pile{position:relative;aspect-ratio:3/4}
.pile .pol{inset:0 9% auto 9%;width:82%;transition:transform .6s var(--ease)}
.pile .pol:nth-child(1){--r:-7deg}
.pile .pol:nth-child(2){--r:6deg}
.pile .pol:nth-child(3){--r:-1.5deg}
.stack:hover .pol:nth-child(1){transform:translate(-14%,3%) rotate(-13deg)}
.stack:hover .pol:nth-child(2){transform:translate(13%,-1%) rotate(12deg)}
.stack:hover .pol:nth-child(3){transform:translateY(-3%) rotate(-1deg)}
.cap{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:20px 4px 0}
.cap b{font:700 30px/1 var(--display);font-stretch:80%;letter-spacing:-.025em;transition:color .25s;overflow-wrap:anywhere}
.stack:hover .cap b{color:var(--pink-ink)}
.cap span{color:var(--ink-2);font-size:13px;white-space:nowrap}

/* ---------- gallery ---------- */
.masonry{columns:4 250px;column-gap:18px;padding-bottom:40px}
.tile{position:relative;margin:0 0 18px;break-inside:avoid}
.thumb{display:block;width:100%;padding:0;border:0;border-radius:16px;overflow:hidden;background:var(--paper-2);cursor:zoom-in}
.thumb img{width:100%;height:auto;transition:transform .7s var(--ease),filter .4s}
.thumb:hover img{transform:scale(1.04)}
.fav{position:absolute;top:10px;right:10px;width:38px;height:38px;border-radius:50%;border:0;display:grid;place-items:center;cursor:pointer;
  background:rgba(255,255,255,.88);color:#c81d6b;opacity:0;transform:scale(.85);transition:.25s var(--ease)}
.tile:hover .fav,.fav:focus-visible,.fav.on{opacity:1;transform:none}
.fav.on{background:var(--pink);color:var(--on-pink)}
.fav.on svg{fill:currentColor}
@media(hover:none){.fav{opacity:.92;transform:none}}

/* ---------- empty ---------- */
.empty{border:2px dashed var(--line);border-radius:28px;padding:64px 24px;text-align:center;margin-top:26px;background:color-mix(in srgb,var(--card) 55%,transparent)}
.empty .badge{width:64px;height:64px;border-radius:20px;margin:0 auto 18px;background:var(--pink);color:var(--on-pink);display:grid;place-items:center;rotate:-6deg}
.empty .badge svg{width:28px;height:28px}
.empty h3{margin:0 0 6px;font:700 30px/1.1 var(--display);font-stretch:85%}
.empty p{margin:0 auto 22px;max-width:30em;color:var(--ink-2)}

footer{padding:30px 5vw 50px;color:var(--ink-2);font-size:13px;text-align:center}
footer button{background:none;border:0;color:var(--pink-ink);cursor:pointer;text-decoration:underline;text-underline-offset:3px;padding:0}

/* ---------- lightbox ---------- */
.lb{position:fixed;inset:0;z-index:50;background:rgba(24,6,16,.94);backdrop-filter:blur(18px);color:#fff;
  opacity:0;visibility:hidden;transition:opacity .3s,visibility 0s .3s}
.lb.open{opacity:1;visibility:visible;transition:opacity .3s}
.lb-bar{position:absolute;top:0;left:0;right:0;height:72px;display:flex;justify-content:space-between;align-items:center;padding:0 max(20px,env(safe-area-inset-left));z-index:3}
.lb-count{font-weight:500}.lb-count small{opacity:.65;margin-left:10px;font-weight:400}
.lb-tools{display:flex;gap:8px}
.lbb{width:44px;height:44px;border-radius:50%;border:0;background:rgba(255,255,255,.1);color:#fff;display:grid;place-items:center;cursor:pointer;transition:background .2s,transform .2s}
.lbb:hover{background:rgba(255,255,255,.22)}
.lbb.on{background:var(--pink);color:var(--on-pink)}
.lbb.on svg{fill:currentColor}
.lb-stage{position:absolute;inset:72px 0 104px;display:grid;place-items:center;touch-action:pan-y;overflow:hidden}
.zoomwrap{transition:transform .35s var(--ease);will-change:transform;cursor:zoom-in}
.zoomwrap.z{cursor:zoom-out;transform:scale(2.2)}
.zoomwrap img{max-width:min(92vw,1100px);max-height:calc(100dvh - 190px);object-fit:contain;border-radius:6px;user-select:none;-webkit-user-drag:none}
.nav{position:absolute;top:50%;translate:0 -50%;z-index:3}
.nav.p{left:max(16px,2vw)}.nav.n{right:max(16px,2vw)}
.strip{position:absolute;left:0;right:0;bottom:0;height:104px;display:flex;gap:8px;align-items:center;justify-content:safe center;overflow-x:auto;padding:0 20px env(safe-area-inset-bottom);scrollbar-width:none}
.strip button{flex:none;width:52px;height:70px;padding:0;border:2px solid transparent;border-radius:8px;overflow:hidden;opacity:.5;cursor:pointer;background:#000;transition:.25s var(--ease)}
.strip button img{width:100%;height:100%;object-fit:cover}
.strip button.on{opacity:1;border-color:var(--pink);transform:translateY(-4px)}
@media(max-width:700px){.nav{display:none}}

/* ---------- dialogs ---------- */
dialog{border:0;padding:0;background:var(--card);color:var(--ink);border-radius:26px;width:min(480px,92vw);box-shadow:0 40px 90px -30px rgba(100,0,50,.7)}
dialog::backdrop{background:rgba(40,5,25,.55);backdrop-filter:blur(8px)}
dialog[open]{animation:pop .35s var(--ease)}
dialog[open]::backdrop{animation:fade .3s}
@keyframes pop{from{opacity:0;transform:translateY(16px) scale(.97)}}
@keyframes fade{from{opacity:0}}
.form{padding:30px}
.form h3{margin:0 0 4px;font:700 30px/1.05 var(--display);font-stretch:85%;letter-spacing:-.02em}
.form p{margin:0 0 20px;color:var(--ink-2);font-size:14px}
.form input[type=text]{width:100%;height:50px;border-radius:14px;border:1.5px solid var(--line);background:var(--paper);color:var(--ink);padding:0 16px;font:inherit;outline:none}
.form input[type=text]:focus{border-color:var(--pink)}
.filepick{display:flex;align-items:center;gap:10px;margin-top:12px;padding:12px 14px;border:1.5px dashed var(--line);border-radius:14px;color:var(--ink-2);cursor:pointer;font-size:14px}
.filepick:hover{border-color:var(--pink);color:var(--ink)}
.filepick input{display:none}
.form-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:24px}
dialog.pal{width:min(640px,94vw);margin:12vh auto auto}
.pal input{width:100%;height:64px;border:0;border-bottom:1px solid var(--line);background:none;color:var(--ink);padding:0 24px;font:500 18px var(--body);outline:none}
.pal ul{list-style:none;margin:0;padding:8px;max-height:52vh;overflow:auto}
.pal li button{display:flex;width:100%;justify-content:space-between;gap:14px;align-items:center;border:0;background:none;text-align:left;padding:12px 16px;border-radius:14px;cursor:pointer}
.pal li button[aria-selected=true]{background:var(--pink);color:var(--on-pink)}
.pal li small{opacity:.7}
.pal .none{padding:26px;text-align:center;color:var(--ink-2)}

/* ---------- toast & drop ---------- */
.toast{position:fixed;left:50%;bottom:max(24px,env(safe-area-inset-bottom));z-index:90;translate:-50% 20px;opacity:0;pointer-events:none;
  background:var(--ink);color:var(--paper);padding:12px 14px 12px 20px;border-radius:99px;display:flex;gap:16px;align-items:center;font-size:14px;
  box-shadow:0 20px 40px -16px rgba(80,0,40,.6);transition:.35s var(--ease);max-width:92vw}
.toast.show{opacity:1;translate:-50% 0;pointer-events:auto}
.toast button{border:0;background:var(--pink);color:var(--on-pink);border-radius:99px;padding:6px 14px;font-weight:600;cursor:pointer}
.dropveil{position:fixed;inset:14px;z-index:70;border:3px dashed var(--pink);border-radius:32px;background:color-mix(in srgb,var(--paper) 86%,var(--pink));
  display:grid;place-items:center;text-align:center;font:700 clamp(28px,5vw,56px)/1.05 var(--display);font-stretch:80%;opacity:0;pointer-events:none;transition:opacity .2s}
.dropveil.on{opacity:1}

/* view transitions */
::view-transition-old(root){animation:vt-out .28s ease both}
::view-transition-new(root){animation:vt-in .5s var(--ease) both}
@keyframes vt-out{to{opacity:0;transform:scale(.985)}}
@keyframes vt-in{from{opacity:0;transform:translateY(18px)}}

@media(max-width:860px){
  .hero{grid-template-columns:1fr;padding-top:3vh}
  .fan{width:min(100%,380px)}
  .stack:nth-child(even){margin-top:0}
  .pill .lbl,.pill kbd{display:none}
  .pill:not(.sq){width:42px;padding:0;justify-content:center}
  .row .m{display:none}
  .hero-actions .btn:not(.primary){display:none}
  .filter{min-width:0;flex:1}
  .grp{grid-template-columns:34px 1fr}
}
@media(max-width:560px){
  .stacks{grid-template-columns:repeat(2,1fr);gap:34px 16px}
  .cap b{font-size:22px}.cap{flex-direction:column;gap:2px}
  .masonry{columns:2;column-gap:10px}.tile{margin-bottom:10px}
  .gridv{grid-template-columns:repeat(2,1fr);gap:12px}
  .gcard b{font-size:21px}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}
}
</style>
</head>
<body class="intro">

<header class="top">
  <a class="brand" href="#/" aria-label="Về trang chủ"><i><svg viewBox="0 0 24 24"><path d="M12 21s-8-5-8-11a4.5 4.5 0 0 1 8-2.8A4.5 4.5 0 0 1 20 10c0 6-8 11-8 11z"/></svg></i>otaku archive</a>
  <div class="top-r">
    <button class="pill" data-act="palette" aria-label="Tìm kiếm"><svg class="i" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><span class="lbl">Tìm anime hoặc nhân vật</span><kbd>/</kbd></button>
    <button class="pill sq" data-act="theme" aria-label="Đổi giao diện sáng hoặc tối"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 3v18" /><path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor"/></svg></button>
    <button class="pill sq" data-act="menu" aria-label="Thêm tuỳ chọn" aria-haspopup="true"><svg class="i" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.2"/><circle cx="12" cy="12" r="1.2"/><circle cx="19" cy="12" r="1.2"/></svg></button>
  </div>

/* ============ LƯU TRỮ (IndexedDB, dùng lại dữ liệu cũ) ============ */
let state = null;
function idb(){return new Promise((res,rej)=>{
  const r=indexedDB.open('otaku-archive',1);
  r.onupgradeneeded=()=>r.result.createObjectStore('kv');
  r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);
})}
async function load(){
  try{
    const db=await idb();
    return await new Promise(res=>{
      const q=db.transaction('kv').objectStore('kv').get('state');
      q.onsuccess=()=>res(q.result||null);q.onerror=()=>res(null);
    });
  }catch(e){return null}
}
/* Hai chế độ lưu:
   - 'folder' : mở qua server.js (http://localhost:3000) → ảnh ghi thẳng vào thư mục library/
   - 'browser': mở trực tiếp file index.html → lưu trong trình duyệt (IndexedDB) */
let MODE='browser', DIR='';
const imgUrl = id => `/library/images/${id}.jpg`;
const thUrl  = id => `/library/thumbs/${id}.jpg`;
function serialize(){
  return {series:state.series,chars:state.chars,
    photos:state.photos.map(({id,cid,ts,w,h,fav})=>({id,cid,ts,w,h,fav}))};
}
function hydrate(d){
  return {series:d.series||[],chars:d.chars||[],
    photos:(d.photos||[]).map(p=>({...p,img:imgUrl(p.id),th:thUrl(p.id)}))};
}
async function detectFolder(){
  if(!/^https?:$/.test(location.protocol)) return null;
  try{
    const info=await (await fetch('/api/info',{cache:'no-store'})).json();
    const r=await fetch('/api/state',{cache:'no-store'}); if(!r.ok) return null;
    return {dir:info.dir,data:await r.json()};
  }catch(e){ return null }
}
async function putImg(kind,id,dataUrl){
  const blob=await (await fetch(dataUrl)).blob();
  const r=await fetch(`/api/img/${kind}/${id}`,{method:'PUT',headers:{'Content-Type':'image/jpeg'},body:blob});
  if(!r.ok) throw new Error('Không ghi được ảnh vào thư mục');
}
let saveT;
function save(){
  clearTimeout(saveT);
  saveT=setTimeout(async()=>{
    try{
      if(MODE==='folder'){
        const r=await fetch('/api/state',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(serialize())});
        if(!r.ok) throw new Error('save');
      } else {
        const db=await idb();db.transaction('kv','readwrite').objectStore('kv').put(state,'state');
      }
    }catch(e){toast(MODE==='folder'?'Không lưu được. Server còn đang chạy không?':'Không lưu được vào trình duyệt. Hãy xuất bản sao lưu.')}
  },250);
}
function seed(){
  const s={id:uid(),name:'Gotoubun no Hanayome'};
  const c={id:uid(),sid:s.id,name:'Nino Nakano'};
  const t=Date.now();
  return {series:[s],chars:[c],photos:SEED_IMGS.map((img,i)=>({id:uid(),cid:c.id,img,ts:t+i}))};
}
function migrate(){
  state.series ||= []; state.chars ||= []; state.photos ||= [];
  state.photos.forEach((p,i)=>{ if(!p.ts) p.ts=i+1 });
}

/* ============ ẢNH: XỬ LÝ & ẢNH THU NHỎ ============ */
const loadImg = src => new Promise((res,rej)=>{const im=new Image();im.onload=()=>res(im);im.onerror=rej;im.src=src});
function scaled(im,max,q){
  const k=Math.min(1,max/Math.max(im.naturalWidth,im.naturalHeight));
  const w=Math.round(im.naturalWidth*k), h=Math.round(im.naturalHeight*k);
  const c=document.createElement('canvas'); c.width=w; c.height=h;
  c.getContext('2d').drawImage(im,0,0,w,h);
  return {url:c.toDataURL('image/jpeg',q),w,h};
}
const readFile = f => new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=()=>rej(r.error);r.readAsDataURL(f)});
async function processFile(f){
  /* Dùng data URL thay vì blob URL: trang mở bằng file:// sẽ chặn blob URL */
  const url=await readFile(f);
  let im;
  try{ im=await loadImg(url) }
  catch(e){
    if(!window.createImageBitmap) throw e;
    const bm=await createImageBitmap(f); im={naturalWidth:bm.width,naturalHeight:bm.height,_bm:bm};
  }
  const draw=(max,q)=>{
    const W=im.naturalWidth,H=im.naturalHeight,k=Math.min(1,max/Math.max(W,H));
    const w=Math.round(W*k),h=Math.round(H*k),c=document.createElement('canvas');c.width=w;c.height=h;
    c.getContext('2d').drawImage(im._bm||im,0,0,w,h);
    return {url:c.toDataURL('image/jpeg',q),w,h};
  };
  const full=draw(1800,.88), th=draw(520,.8);
  return {img:full.url,th:th.url,w:full.w,h:full.h};
}
let thumbBusy=false;
async function ensureThumbs(){
  if(thumbBusy) return; thumbBusy=true; let changed=false;
  for(const p of state.photos){
    if(p.th && p.w) continue;
    try{
      const im=await loadImg(p.img); const t=scaled(im,520,.8);
      p.th=t.url; p.w=im.naturalWidth; p.h=im.naturalHeight; changed=true;
      $$(`img[data-pid="${p.id}"]`).forEach(el=>{el.src=p.th; const tile=el.closest('.tile'); if(tile) el.style.aspectRatio=`${p.w}/${p.h}`});
    }catch(e){}
  }
  thumbBusy=false; if(changed) save();
}

/* ============ TRUY VẤN ============ */
const charsOf  = sid => state.chars.filter(c=>c.sid===sid);
const photosOf = cid => state.photos.filter(p=>p.cid===cid).sort((a,b)=>a.ts-b.ts);
const photosOfSeries = sid => { const ids=new Set(charsOf(sid).map(c=>c.id)); return state.photos.filter(p=>ids.has(p.cid)) };
const src = p => p.th||p.img;
function coverOfChar(cid){
  const c=state.chars.find(x=>x.id===cid), list=photosOf(cid);
  return list.find(p=>c&&p.id===c.cover)||list[0]||null;
}
function coverOfSeries(sid){
  for(const c of charsOf(sid).sort(cmp)){ const p=coverOfChar(c.id); if(p) return p }
  return null;
}
const initial = n => esc(n.trim().charAt(0).toUpperCase()||'?');
const plural = (n,w) => `${n} ${w}`;
const metaSeries = s => { const c=charsOf(s.id).length, p=photosOfSeries(s.id).length; return `${c} nhân vật, ${p} ảnh` };

/* ============ ĐIỀU HƯỚNG ============ */
function parse(){
  const m=location.hash.match(/^#\/s\/([^/]+)(?:\/c\/([^/]+))?/);
  if(!m) return {view:'home'};
  const s=state.series.find(x=>x.id===m[1]); if(!s) return {view:'home'};
  if(m[2]){ const c=state.chars.find(x=>x.id===m[2]&&x.sid===s.id); if(c) return {view:'char',s,c} }
  return {view:'series',s};
}
let R={view:'home'};
const ui={favOnly:false,filter:'',mode:lsGet('oa-mode')||(finePointer?'list':'grid')};
const go = h => { location.hash=h };
function navigate(){
  const run=()=>{ui.favOnly=false;ui.filter='';render();window.scrollTo(0,0)};
  if(LB.el.classList.contains('open')) closeLB(true);
  hidePeek();
  if(document.startViewTransition && !reduce) document.startViewTransition(run); else run();
}

/* ============ RENDER ============ */
const view=$('#view');
function render(){
  R=parse();
  if(R.view==='home') renderHome();
  else if(R.view==='series') renderSeries();
  else renderChar();
  document.title = R.view==='home' ? 'Otaku Archive' : `${R.view==='char'?R.c.name+' · ':''}${R.s.name} · Otaku Archive`;
}

function emptyState(title,text,act,label){
  return `<div class="empty"><div class="badge">${ICON.heart}</div><h3>${title}</h3><p>${text}</p>
    <button class="btn primary" data-act="${act}">${ICON.plus}${label}</button></div>`;
}

/* ---- trang chủ ---- */
const FAN=[{x:1,y:6,r:-9,d:10},{x:28,y:0,r:5,d:18},{x:53,y:12,r:-3,d:26},{x:30,y:44,r:8,d:36}];

  const nS=state.series.length, nC=state.chars.length, nP=state.photos.length;

    const f=FAN[i];
    return `<div class="pol" style="left:${f.x}%;top:${f.y}%;width:44%;--r:${f.r}deg;--d:${f.d};--i:${i}">${
      it.img?`<img src="${it.img}" alt="">`:`<div class="ph">♡</div>`}</div>`;
  }).join('');
  view.innerHTML=`
  <section class="hero">
    <div>
      <h1>Kho ảnh cosplay</h1>
      <p>${nP} ảnh thuộc ${nC} nhân vật trong ${nS} bộ anime. Mở một bộ anime, chọn nhân vật, rồi xem ảnh.</p>
      <div class="hero-actions">
        <button class="btn primary" data-act="add-series">${ICON.plus}Thêm bộ anime</button>

        <div class="seg" role="group" aria-label="Kiểu hiển thị">
          <button data-act="mode" data-m="list" aria-pressed="${ui.mode==='list'}">Danh sách</button>
          <button data-act="mode" data-m="grid" aria-pressed="${ui.mode==='grid'}">Lưới</button>

function drawIndex(){
  const box=$('#indexBody'); if(!box) return;
  const q=norm(ui.filter.trim());
  const items=state.series.filter(s=>!q||norm(s.name).includes(q)).sort(cmp);
  $('#idxCount').textContent=state.series.length;
  if(!state.series.length){ box.innerHTML=emptyState('Chưa có bộ anime nào','Tạo bộ anime đầu tiên, sau đó thêm nhân vật và ảnh cosplay vào bên trong.','add-series','Thêm bộ anime'); return }
  if(!items.length){ box.innerHTML=`<div class="empty"><h3>Không có kết quả</h3><p>Không có bộ anime nào khớp với “${esc(ui.filter)}”. Thử gõ ít chữ hơn.</p></div>`; return }
  if(ui.mode==='grid'){
    box.innerHTML=`<div class="gridv">${items.map(s=>{const c=coverOfSeries(s.id);return `
      <a class="gcard" href="#/s/${s.id}">${c?`<img src="${src(c)}" alt="">`:`<div class="ph">${initial(s.name)}</div>`}
      <div><b>${esc(s.name)}</b><small>${metaSeries(s)}</small></div></a>`}).join('')}</div>`;
    return;
  }
  const groups={};
  items.forEach(s=>{ const L=norm(s.name).charAt(0).toUpperCase(); const k=/[A-Z]/.test(L)?L:'#'; (groups[k] ||= []).push(s) });
  let i=0;
  box.innerHTML=`<div class="list" id="list">${Object.keys(groups).sort().map(k=>`
    <section class="grp"><div class="letter" aria-hidden="true">${k}</div><div>${groups[k].map(s=>`
      <a class="row" href="#/s/${s.id}" data-sid="${s.id}" style="--i:${i++}"><span class="t">${esc(s.name)}</span><span class="m">${metaSeries(s)}</span></a>`).join('')}</div></section>`).join('')}</div>`;
}

/* ---- trang bộ anime ---- */
function renderSeries(){
  const s=R.s, list=charsOf(s.id).sort(cmp);
  const stacks=list.map(c=>{
    const ph=photosOf(c.id), cv=coverOfChar(c.id);
    const pile=[...ph.filter(p=>!cv||p.id!==cv.id)].reverse().slice(0,2).concat(cv?[cv]:[]).filter(Boolean);
    const pols = pile.length ? pile.map((p,i)=>`<div class="pol"><img src="${src(p)}" alt=""></div>`).join('')
      : `<div class="pol"><div class="ph">${initial(c.name)}</div></div>`;
    return `<a class="stack" href="#/s/${s.id}/c/${c.id}"><div class="pile">${pols}</div>
      <div class="cap"><b>${esc(c.name)}</b><span>${ph.length} ảnh</span></div></a>`;
  }).join('');
  view.innerHTML=`
  <section class="page-head">
    <nav class="crumbs" aria-label="Đường dẫn"><a href="#/">Bộ anime</a><span aria-hidden="true">/</span><b>${esc(s.name)}</b></nav>
    <h1>${esc(s.name)}</h1>
    <p>${metaSeries(s)}</p>
    <div class="head-actions">
      <button class="btn primary" data-act="add-char">${ICON.plus}Thêm nhân vật</button>
      <button class="btn" data-act="rename">${ICON.edit}Đổi tên</button>
      <button class="btn danger" data-act="delete">${ICON.trash}Xoá bộ anime</button>
    </div>
  </section>
  ${list.length?`<section class="stacks" aria-label="Nhân vật">${stacks}</section>`
    :emptyState('Chưa có nhân vật nào','Thêm nhân vật đầu tiên của bộ anime này. Bạn có thể chọn luôn ảnh khi tạo.','add-char','Thêm nhân vật')}`;
}

/* ---- trang nhân vật ---- */
let gallery=[];
function renderChar(){
  const s=R.s,c=R.c, all=photosOf(c.id);

  const tiles=gallery.map((p,i)=>`
    <figure class="tile" data-pid="${p.id}">
      <button class="thumb" data-act="open" data-i="${i}" aria-label="Xem ảnh ${i+1}"><img data-pid="${p.id}" src="${src(p)}" alt="${esc(c.name)}, ảnh ${i+1}" loading="lazy" style="aspect-ratio:${p.w||2}/${p.h||3}"></button>
      <button class="fav ${p.fav?'on':''}" data-act="fav" data-pid="${p.id}" aria-pressed="${!!p.fav}" aria-label="Yêu thích">${ICON.heart}</button>

  view.innerHTML=`
  <section class="page-head">

    <div class="head-actions">
      <button class="btn primary" data-act="add-photos">${ICON.plus}Thêm ảnh</button>
      ${favN?`<button class="btn" data-act="fav-filter" aria-pressed="${ui.favOnly}">${ICON.heart}Chỉ yêu thích</button>`:''}
      <button class="btn" data-act="rename">${ICON.edit}Đổi tên</button>
      <button class="btn danger" data-act="delete">${ICON.trash}Xoá nhân vật</button>

    : all.length?`<div class="empty"><h3>Chưa có ảnh yêu thích</h3><p>Bấm vào trái tim trên một ảnh để đánh dấu.</p></div>`

}

/* ============ SỰ KIỆN CHUNG ============ */
document.addEventListener('click',async e=>{
  const menu=$('#menu');
  if(!e.target.closest('#menu') && !e.target.closest('[data-act=menu]')) menu.classList.remove('open');
  const el=e.target.closest('[data-act]'); if(!el) return;
  const a=el.dataset.act;
  if(a==='menu'){ menu.classList.toggle('open'); return }
  menu.classList.remove('open');
  if(a==='theme') return toggleTheme();
  if(a==='palette') return openPalette();
  if(a==='export') return exportData();
  if(a==='import') return $('#importIn').click();
  if(a==='mode'){ ui.mode=el.dataset.m; lsSet('oa-mode',ui.mode); $$('[data-act=mode]').forEach(b=>b.setAttribute('aria-pressed',b===el)); return drawIndex() }
  if(a==='add-series') return addSeries();
  if(a==='add-char') return addChar();
  if(a==='add-photos') return $('#photoIn').click();
  if(a==='rename') return renameCurrent();
  if(a==='delete') return deleteCurrent();
  if(a==='fav-filter'){ ui.favOnly=!ui.favOnly; return render() }
  if(a==='open') return openLB(+el.dataset.i);
  if(a==='fav'){ e.stopPropagation(); return toggleFav(el.dataset.pid) }
});

/* ============ FORM ============ */
const dlg=$('#formDlg');
function openForm({title,sub='',placeholder='',value='',ok='Lưu',files=false}){
  return new Promise(res=>{
    $('#fTitle').textContent=title; $('#fSub').textContent=sub;
    const inp=$('#fName'); inp.value=value; inp.placeholder=placeholder;
    $('#fOk').textContent=ok;
    const fp=$('#fFiles'), fin=$('#fFilesIn'); fin.value=''; fp.style.display=files?'':'none';
    $('#fFilesTxt').textContent='Chọn ảnh ngay (không bắt buộc)';
    fin.onchange=()=>{ $('#fFilesTxt').textContent=fin.files.length?`Đã chọn ${fin.files.length} ảnh`:'Chọn ảnh ngay (không bắt buộc)' };
    dlg.showModal(); inp.focus(); inp.select();
    dlg.addEventListener('close',()=>{
      res(dlg.returnValue==='ok' ? {name:inp.value.trim(),files:[...fin.files]} : null);
      dlg.returnValue='';
    },{once:true});
  });
}
async function addSeries(){
  const r=await openForm({title:'Thêm bộ anime',sub:'Nhập tên bộ anime, game hoặc manga.',placeholder:'Ví dụ: Frieren',ok:'Thêm bộ anime'});
  if(!r||!r.name) return;
  const ex=state.series.find(s=>norm(s.name)===norm(r.name));
  if(ex){ toast('Bộ anime này đã có'); return go('#/s/'+ex.id) }
  const s={id:uid(),name:r.name}; state.series.push(s); save(); go('#/s/'+s.id);
}
async function addChar(){
  const r=await openForm({title:'Thêm nhân vật',sub:`Nhân vật thuộc ${R.s.name}.`,placeholder:'Ví dụ: Nino Nakano',ok:'Thêm nhân vật',files:true});
  if(!r||!r.name) return;
  let c=charsOf(R.s.id).find(x=>norm(x.name)===norm(r.name));
  if(c) toast('Nhân vật này đã có');
  else { c={id:uid(),sid:R.s.id,name:r.name}; state.chars.push(c); save() }
  if(r.files.length){ await addPhotos(c.id,r.files,true) }
  go(`#/s/${R.s.id}/c/${c.id}`);
}
async function renameCurrent(){
  const t=R.view==='char'?R.c:R.s;
  const r=await openForm({title:'Đổi tên',value:t.name,ok:'Lưu tên'});
  if(!r||!r.name||r.name===t.name) return;
  t.name=r.name; save(); render(); toast('Đã đổi tên');
}
$('#photoIn').onchange=e=>{ if(R.view==='char') addPhotos(R.c.id,[...e.target.files]); e.target.value='' };

async function addPhotos(cid,files,silent){
  files=files.filter(f=>f.type.startsWith('image/')); if(!files.length) return;
  let ok=0,fail=0, t=Date.now();
  for(let i=0;i<files.length;i++){
    toast(`Đang xử lý ảnh ${i+1}/${files.length}…`,{ms:0});
    try{ const r=await processFile(files[i]); const id=uid(); if(MODE==='folder'){ await putImg('images',id,r.img); await putImg('thumbs',id,r.th); r.img=imgUrl(id); r.th=thUrl(id) } state.photos.push({id,cid,ts:t+i,...r}); ok++ }catch(e){ fail++; console.error('Không đọc được ảnh',files[i].name,e) }
  }
  save();
  if(!silent && R.view==='char' && R.c.id===cid) render();
  toast(`Đã thêm ${ok} ảnh${fail?`, ${fail} ảnh không đọc được`:''}`);
}
/* kéo thả */
let dragDepth=0;
const veil=$('#dropveil');
addEventListener('dragenter',e=>{ if(R.view!=='char'||!e.dataTransfer?.types?.includes('Files')) return; dragDepth++; $('#dropName').textContent=`Thêm vào ${R.c.name}`; veil.classList.add('on') });
addEventListener('dragleave',()=>{ if(R.view!=='char') return; dragDepth=Math.max(0,dragDepth-1); if(!dragDepth) veil.classList.remove('on') });
addEventListener('dragover',e=>{ if(R.view==='char') e.preventDefault() });
addEventListener('drop',e=>{ if(R.view!=='char') return; e.preventDefault(); dragDepth=0; veil.classList.remove('on'); addPhotos(R.c.id,[...e.dataTransfer.files]) });

/* ============ XOÁ + HOÀN TÁC ============ */
function removeWithUndo(rm,label,after){
  const S=new Set(rm.series.map(x=>x.id)), C=new Set(rm.chars.map(x=>x.id)), P=new Set(rm.photos.map(x=>x.id));
  state.series=state.series.filter(x=>!S.has(x.id));
  state.chars=state.chars.filter(x=>!C.has(x.id));
  state.photos=state.photos.filter(x=>!P.has(x.id));
  save(); after&&after();
  toast(label,{ms:8000,action:'Hoàn tác',fn:()=>{
    state.series.push(...rm.series); state.chars.push(...rm.chars); state.photos.push(...rm.photos);
    save(); render(); toast('Đã khôi phục');
  }});
}
function deleteCurrent(){
  if(R.view==='char'){
    const c=R.c, ph=photosOf(c.id), sid=c.sid;
    if(!confirm(`Xoá nhân vật “${c.name}” và ${ph.length} ảnh?`)) return;
    removeWithUndo({series:[],chars:[c],photos:ph},`Đã xoá ${c.name}`,()=>go('#/s/'+sid));
  } else {
    const s=R.s, cs=charsOf(s.id), ph=photosOfSeries(s.id);
    if(!confirm(`Xoá bộ anime “${s.name}” cùng ${cs.length} nhân vật và ${ph.length} ảnh?`)) return;
    removeWithUndo({series:[s],chars:cs,photos:ph},`Đã xoá ${s.name}`,()=>go('#/'));
  }
}
function toggleFav(pid){
  const p=state.photos.find(x=>x.id===pid); if(!p) return;
  p.fav=!p.fav; save();
  $$(`.fav[data-pid="${pid}"]`).forEach(b=>{b.classList.toggle('on',p.fav);b.setAttribute('aria-pressed',p.fav)});
  if(LB.el.classList.contains('open')) updateChrome(p);
  if(R.view==='char'){ const n=photosOf(R.c.id).filter(x=>x.fav).length; if(!n||p.fav&&n===1) render() }
}

/* ============ LIGHTBOX ============ */
const LB={el:$('#lb'),img:$('#lbImg'),zw:$('#lbZoom'),strip:$('#lbStrip'),cnt:$('#lbCount'),stage:$('#lbStage'),list:[],i:0,zoom:false};
const thumbEl = p => $(`.tile[data-pid="${p.id}"] img`);
const ease='cubic-bezier(.2,.8,.2,1)';
function buildStrip(){
  LB.strip.innerHTML=LB.list.map((p,i)=>`<button data-lb="goto" data-i="${i}" aria-label="Ảnh ${i+1}"><img src="${src(p)}" alt=""></button>`).join('');
}
function updateChrome(p){
  LB.cnt.innerHTML=`${esc(R.c.name)}<small>${LB.i+1} / ${LB.list.length}</small>`;
  $('[data-lb=fav]',LB.el).classList.toggle('on',!!p.fav);
  const c=state.chars.find(x=>x.id===p.cid);
  $('[data-lb=cover]',LB.el).classList.toggle('on',!!c&&c.cover===p.id);
  const dl=$('[data-lb=dl]',LB.el); dl.href=p.img; dl.download=`${R.c.name.replace(/\s+/g,'-')}-${LB.i+1}.jpg`;
  $$('button',LB.strip).forEach((b,i)=>{b.classList.toggle('on',i===LB.i); if(i===LB.i) b.scrollIntoView({inline:'center',block:'nearest',behavior:reduce?'auto':'smooth'})});
  $$('.nav',LB.el).forEach(b=>b.style.display=LB.list.length<2?'none':'');
}
async function openLB(i){
  LB.list=gallery; LB.i=i; setZoom(false); buildStrip();
  LB.el.classList.add('open'); LB.el.setAttribute('aria-hidden','false'); document.body.classList.add('lb-open');
  await showPhoto(0,true);
}
async function showPhoto(dir,first){
  const p=LB.list[LB.i]; if(!p) return;
  LB.img.src=p.img; try{await LB.img.decode()}catch(e){}
  LB.img.alt=`${R.c.name}, ảnh ${LB.i+1}`;
  updateChrome(p);
  if(reduce) return;
  if(first){
    const t=thumbEl(p); if(!t) return;
    const a=t.getBoundingClientRect(), b=LB.img.getBoundingClientRect(); if(!b.width) return;
    LB.img.animate([{transformOrigin:'top left',transform:`translate(${a.left-b.left}px,${a.top-b.top}px) scale(${a.width/b.width},${a.height/b.height})`},
      {transformOrigin:'top left',transform:'none'}],{duration:520,easing:ease});
  } else if(dir){
    LB.img.animate([{opacity:0,transform:`translateX(${dir*60}px)`},{opacity:1,transform:'none'}],{duration:320,easing:ease});
  }
}
function step(d){ if(LB.list.length<2) return; setZoom(false); LB.i=(LB.i+d+LB.list.length)%LB.list.length; showPhoto(d) }
async function closeLB(instant){
  if(!LB.el.classList.contains('open')) return;
  setZoom(false);
  const p=LB.list[LB.i], t=p&&thumbEl(p);
  const fin=()=>{LB.el.setAttribute('aria-hidden','true');document.body.classList.remove('lb-open')};
  if(!instant && !reduce && t){
    const a=t.getBoundingClientRect();
    if(a.bottom>0&&a.top<innerHeight){
      const b=LB.img.getBoundingClientRect();
      const an=LB.img.animate([{transformOrigin:'top left',transform:'none'},
        {transformOrigin:'top left',transform:`translate(${a.left-b.left}px,${a.top-b.top}px) scale(${a.width/b.width},${a.height/b.height})`}],
        {duration:380,easing:'cubic-bezier(.4,0,.2,1)',fill:'forwards'});
      LB.el.classList.remove('open');
      try{await an.finished}catch(e){}
      an.cancel(); fin(); return;
    }
  }
  LB.el.classList.remove('open'); fin();
}
function setZoom(on,ev){
  LB.zoom=on; LB.zw.classList.toggle('z',on);
  if(on&&ev){ const r=LB.zw.getBoundingClientRect(); LB.zw.style.transformOrigin=`${(ev.clientX-r.left)/r.width*100}% ${(ev.clientY-r.top)/r.height*100}%` }
}
LB.zw.addEventListener('pointermove',e=>{ if(LB.zoom&&e.pointerType==='mouse'){ const r=LB.zw.getBoundingClientRect(); const x=(e.clientX-r.left)/r.width, y=(e.clientY-r.top)/r.height; LB.zw.style.transformOrigin=`${Math.min(100,Math.max(0,x*100))}% ${Math.min(100,Math.max(0,y*100))}%` } });
let sx=0,sy=0,moved=0;
LB.stage.addEventListener('pointerdown',e=>{sx=e.clientX;sy=e.clientY;moved=0});
LB.stage.addEventListener('pointermove',e=>{moved=Math.max(moved,Math.abs(e.clientX-sx))});
LB.stage.addEventListener('pointerup',e=>{
  const dx=e.clientX-sx, dy=e.clientY-sy;
  if(!LB.zoom && Math.abs(dx)>70 && Math.abs(dx)>Math.abs(dy)*1.5) step(dx<0?1:-1);
});
LB.img.addEventListener('click',e=>{ e.stopPropagation(); if(moved>8) return; setZoom(!LB.zoom,e) });
LB.el.addEventListener('click',async e=>{
  const b=e.target.closest('[data-lb]');
  if(!b){ if(!e.target.closest('.strip')&&!e.target.closest('.zoomwrap')) closeLB(); return }
  const a=b.dataset.lb, p=LB.list[LB.i];
  if(a==='close') closeLB();
  else if(a==='prev') step(-1);
  else if(a==='next') step(1);
  else if(a==='goto'){ const i=+b.dataset.i; if(i!==LB.i){const d=i>LB.i?1:-1;LB.i=i;setZoom(false);showPhoto(d)} }
  else if(a==='fav') toggleFav(p.id);
  else if(a==='cover'){ const c=state.chars.find(x=>x.id===p.cid); c.cover=p.id; save(); updateChrome(p); toast('Đã đặt làm ảnh bìa của '+c.name) }
  else if(a==='del'){
    LB.list=LB.list.filter(x=>x.id!==p.id);
    removeWithUndo({series:[],chars:[],photos:[p]},'Đã xoá 1 ảnh',()=>{
      if(!LB.list.length){ closeLB(true); } else { LB.i=Math.min(LB.i,LB.list.length-1); buildStrip(); showPhoto(0) }
      render();
    });
  }
});

/* ============ TÌM KIẾM NHANH ============ */
const pal=$('#pal'), palIn=$('#palIn'), palList=$('#palList');
let palItems=[], palSel=0;
function openPalette(){ if(pal.open) return; palIn.value=''; drawPal(); pal.showModal(); palIn.focus() }
function drawPal(){
  const q=norm(palIn.value.trim());
  const S=state.series.map(s=>({t:s.name,sub:'Bộ anime',h:'#/s/'+s.id,k:norm(s.name)}));
  const C=state.chars.map(c=>{const s=state.series.find(x=>x.id===c.sid);return {t:c.name,sub:s?s.name:'',h:`#/s/${c.sid}/c/${c.id}`,k:norm(c.name+' '+(s?s.name:''))}});
  palItems=[...S,...C].filter(it=>!q||q.split(/\s+/).every(w=>it.k.includes(w))).slice(0,30);
  palSel=0;
  palList.innerHTML=palItems.length?palItems.map((it,i)=>`<li role="presentation"><button role="option" data-i="${i}" aria-selected="${i===0}"><b>${esc(it.t)}</b><small>${esc(it.sub)}</small></button></li>`).join('')
    :`<li class="none">Không tìm thấy kết quả nào.</li>`;
}
function palMove(d){
  if(!palItems.length) return; palSel=(palSel+d+palItems.length)%palItems.length;
  $$('button',palList).forEach((b,i)=>{b.setAttribute('aria-selected',i===palSel); if(i===palSel) b.scrollIntoView({block:'nearest'})});
}
function palGo(i){ const it=palItems[i]; if(!it) return; pal.close(); go(it.h) }
palIn.addEventListener('input',drawPal);
palIn.addEventListener('keydown',e=>{
  if(e.key==='ArrowDown'){e.preventDefault();palMove(1)}
  else if(e.key==='ArrowUp'){e.preventDefault();palMove(-1)}
  else if(e.key==='Enter'){e.preventDefault();palGo(palSel)}
});
palList.addEventListener('click',e=>{const b=e.target.closest('button');if(b)palGo(+b.dataset.i)});
pal.addEventListener('click',e=>{if(e.target===pal)pal.close()});
dlg.addEventListener('click',e=>{if(e.target===dlg)dlg.close('cancel')});
$('#fCancel').onclick=()=>dlg.close('cancel');

/* ============ PHÍM TẮT ============ */
addEventListener('keydown',e=>{
  if(LB.el.classList.contains('open')){
    if(e.key==='Escape') closeLB();
    else if(e.key==='ArrowLeft') step(-1);
    else if(e.key==='ArrowRight') step(1);
    return;
  }
  const typing=/INPUT|TEXTAREA/.test(document.activeElement.tagName)||document.activeElement.isContentEditable;
  if((e.key==='/'&&!typing)||((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k')){ e.preventDefault(); openPalette() }
});

/* ============ XEM TRƯỚC KHI RÊ CHUỘT (danh sách) ============ */
const peek=$('#peek'), peekIn=$('#peekIn');
const pk={x:0,y:0,tx:0,ty:0,sid:null,raf:0,on:false};
function hidePeek(){ pk.on=false; pk.sid=null; peek.classList.remove('on') }
function peekLoop(){
  const dx=pk.tx-pk.x, dy=pk.ty-pk.y;
  pk.x+=dx*.16; pk.y+=dy*.16;
  const rot=Math.max(-14,Math.min(14,dx*.12));
  const px=Math.min(pk.x+48, innerWidth-260), py=Math.max(84,Math.min(pk.y-170, innerHeight-340));
  peek.style.transform=`translate3d(${px}px,${py}px,0) rotate(${rot}deg)`;
  if(pk.on||Math.abs(dx)>.5||Math.abs(dy)>.5) pk.raf=requestAnimationFrame(peekLoop); else pk.raf=0;
}
if(finePointer && !reduce){
  addEventListener('pointermove',e=>{
    const row=e.target.closest&&e.target.closest('.row');
    if(!row){ if(pk.on) hidePeek(); return }
    pk.tx=e.clientX; pk.ty=e.clientY;
    if(!pk.on){ pk.x=e.clientX; pk.y=e.clientY }
    if(row.dataset.sid!==pk.sid){
      pk.sid=row.dataset.sid;
      const s=state.series.find(x=>x.id===pk.sid), c=s&&coverOfSeries(s.id);
      peekIn.innerHTML=c?`<img src="${src(c)}" alt="">`:`<div class="ph">${s?initial(s.name):''}</div>`;
    }
    pk.on=true; peek.classList.add('on');
    if(!pk.raf) pk.raf=requestAnimationFrame(peekLoop);
  },{passive:true});
  document.addEventListener('pointerleave',hidePeek);
  addEventListener('scroll',()=>{ if(pk.on) hidePeek() },{passive:true});
}

/* ============ HIỆU ỨNG LỆCH THEO CHUỘT (trang chủ) ============ */
function initParallax(){
  const hero=$('.hero'), fan=$('#fan'); if(!hero||!fan||reduce||!finePointer) return;
  let raf=0,mx=0,my=0;
  hero.addEventListener('pointermove',e=>{
    const r=hero.getBoundingClientRect();
    mx=((e.clientX-r.left)/r.width-.5)*2; my=((e.clientY-r.top)/r.height-.5)*2;
    if(!raf) raf=requestAnimationFrame(()=>{fan.style.setProperty('--mx',mx.toFixed(3));fan.style.setProperty('--my',my.toFixed(3));raf=0});
  });
  hero.addEventListener('pointerleave',()=>{fan.style.setProperty('--mx',0);fan.style.setProperty('--my',0)});
}

/* ============ GIAO DIỆN SÁNG / TỐI ============ */
function applyTheme(t){ if(t) document.documentElement.dataset.theme=t; else delete document.documentElement.dataset.theme }
function toggleTheme(){
  const cur=document.documentElement.dataset.theme||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');
  const next=cur==='dark'?'light':'dark'; applyTheme(next); lsSet('oa-theme',next);
}
applyTheme(lsGet('oa-theme'));

/* ============ SAO LƯU ============ */
async function toDataUrl(url){
  const blob=await (await fetch(url)).blob();
  return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(blob)});
}
async function exportData(){
  try{
    let photos=state.photos;
    if(MODE==='folder'){
      photos=[];
      for(let i=0;i<state.photos.length;i++){
        toast(`Đang đóng gói ảnh ${i+1}/${state.photos.length}…`,{ms:0});
        const p=state.photos[i]; photos.push({...p,img:await toDataUrl(p.img),th:await toDataUrl(p.th)});
      }
    }
    const blob=new Blob([JSON.stringify({app:'otaku-archive',version:2,exported:new Date().toISOString(),series:state.series,chars:state.chars,photos})],{type:'application/json'});
    const a=document.createElement('a'), d=new Date().toISOString().slice(0,10);
    a.href=URL.createObjectURL(blob); a.download=`otaku-archive-${d}.json`; document.body.append(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href),4000);
    toast('Đã xuất bản sao lưu');
  }catch(e){ toast('Không xuất được bản sao lưu') }
}
async function ingestPhoto(x){
  /* chế độ thư mục: ghi ảnh từ bản sao lưu ra file */
  const im=await loadImg(x.img);
  const full=scaled(im,1800,.9), th=(x.th&&x.th.startsWith('data:'))?{url:x.th}:scaled(im,520,.8);
  await putImg('images',x.id,full.url); await putImg('thumbs',x.id,th.url);
  return {id:x.id,cid:x.cid,ts:x.ts||Date.now(),w:full.w,h:full.h,fav:!!x.fav,img:imgUrl(x.id),th:thUrl(x.id)};
}
$('#importIn').onchange=async e=>{
  const f=e.target.files[0]; e.target.value=''; if(!f) return;
  try{
    const d=JSON.parse(await f.text());
    if(!Array.isArray(d.series)||!Array.isArray(d.chars)||!Array.isArray(d.photos)) throw 0;
    const has=(arr,id)=>arr.some(x=>x.id===id); let n=0;
    d.series.forEach(x=>{ if(!has(state.series,x.id)){state.series.push({id:x.id,name:x.name});n++} });
    d.chars.forEach(x=>{ if(!has(state.chars,x.id)&&has(state.series,x.sid)) state.chars.push({id:x.id,sid:x.sid,name:x.name,cover:x.cover}) });
    const add=d.photos.filter(x=>!has(state.photos,x.id)&&has(state.chars,x.cid)&&x.img);
    for(let i=0;i<add.length;i++){
      toast(`Đang nhập ảnh ${i+1}/${add.length}…`,{ms:0});
      state.photos.push(MODE==='folder'&&add[i].img.startsWith('data:')?await ingestPhoto(add[i]):add[i]);
    }
    migrate(); save(); render(); ensureThumbs(); toast(n?`Đã gộp ${n} bộ anime mới`:'Đã gộp dữ liệu, không có bộ anime mới');
  }catch(err){ toast('File này không phải bản sao lưu của Otaku Archive') }
};

/* ============ THÔNG BÁO ============ */
let toastT;
function toast(msg,o={}){
  const t=$('#toast'); clearTimeout(toastT);
  $('#toastMsg').textContent=msg;
  $$('button',t).forEach(b=>b.remove());
  if(o.action){ const b=document.createElement('button'); b.textContent=o.action; b.onclick=()=>{t.classList.remove('show');o.fn()}; t.append(b) }
  t.classList.add('show');
  const ms=o.ms===undefined?2600:o.ms;
  if(ms) toastT=setTimeout(()=>t.classList.remove('show'),ms);
}

/* ============ KHỞI ĐỘNG ============ */
addEventListener('hashchange',navigate);
function setFooter(){
  $('#foot').innerHTML = MODE==='folder'
    ? `Ảnh được lưu trong thư mục <b>${esc(DIR)}</b>.`
    : `Đang lưu trong trình duyệt. Chạy <b>node server.js</b> rồi mở <b>localhost:3000</b> để lưu ảnh vào thư mục. <button data-act="export">Xuất bản sao lưu</button>`;
}
(async()=>{
  const f=await detectFolder();
  if(f){ MODE='folder'; DIR=f.dir; state=f.data?hydrate(f.data):{series:[],chars:[],photos:[]} }
  else { state=await load(); if(!state){ state=seed(); save() } }
  migrate();
  setFooter();
  render();
  ensureThumbs();
  try{ navigator.storage&&navigator.storage.persist&&navigator.storage.persist() }catch(e){}
})();
</script>
